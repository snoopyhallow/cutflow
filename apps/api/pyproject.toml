[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cutflow"
version = "0.1.0"
description = "Local-first AI Video Clipping Studio & Non-Linear Timeline Editor"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "jsonschema>=4.23.0",
    "keyring>=25.5.0",
    "numpy>=2.0.0",
    "pillow>=11.0.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0.36",
    "typer>=0.15.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
ml = [
    "faster-whisper>=1.1.0",
    "yt-dlp>=2025.1.15",
]

[project.scripts]
cutflow = "cutflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cutflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
